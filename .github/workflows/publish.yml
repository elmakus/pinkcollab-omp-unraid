name: Build and publish OMP + PinkCollab + Orca

on:
  workflow_dispatch:
  schedule:
    # Daily, UTC. GitHub may delay scheduled runs.
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - start-orca.sh
      - supervisord.conf
      - healthcheck.js
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate entrypoint
        run: sh -n entrypoint.sh && sh -n start-orca.sh && node --check healthcheck.js

      - name: Discover latest upstream versions
        id: versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          omp_tag="$(gh api repos/can1357/oh-my-pi/releases/latest --jq '.tag_name')"
          pink_version="$(npm view pinkcollab version)"
          [[ "$omp_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$pink_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/pinkcollab-omp"
          code_rev="$(echo "$GITHUB_SHA" | cut -c1-12)"
          version_tag="omp-${omp_tag#v}-pink-${pink_version}-orca-1.4.247-rev-${code_rev}"
          {
            echo "omp_tag=$omp_tag"
            echo "pink_version=$pink_version"
            echo "image=$image"
            echo "version_tag=$version_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: OMP $omp_tag + PinkCollab $pink_version; repo revision $code_rev"

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if this combination already exists
        id: existing
        shell: bash
        run: |
          if docker buildx imagetools inspect '${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.version_tag }}' >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Already published; skipping unchanged versions.'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build image locally
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.versions.outputs.image }}:latest
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.version_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.versions.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            OMP_TAG=${{ steps.versions.outputs.omp_tag }}
            PINK_VERSION=${{ steps.versions.outputs.pink_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test gateway before publishing
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name omp-pink-smoke -e ORCA_PAIRING_ADDRESS=192.0.2.1 '${{ steps.versions.outputs.image }}:latest'
          trap 'docker logs omp-pink-smoke || true; docker rm -f omp-pink-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 55); do
            status="$(docker inspect --format '{{.State.Health.Status}}' omp-pink-smoke)"
            if [ "$status" = healthy ]; then ready=1; break; fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' omp-pink-smoke)" != true ]; then break; fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then echo 'Gateway never became healthy' >&2; exit 1; fi
          docker exec omp-pink-smoke omp --version
          docker exec omp-pink-smoke pinkcollab --version
          docker exec omp-pink-smoke orca-ide --version
          docker exec omp-pink-smoke node /usr/local/bin/healthcheck.js
          echo 'PinkCollab + Orca smoke test passed.'

      - name: Publish tested image
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          docker push '${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.version_tag }}'
          docker push '${{ steps.versions.outputs.image }}:latest'